name: Update SmartDNS

on:
  workflow_dispatch:

jobs:
  update-smartdns:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install UPX 5.2.0
        run: |
          set -e
          curl -L -o /tmp/upx-5.2.0-amd64_linux.tar.xz https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz
          tar -C /tmp -xf /tmp/upx-5.2.0-amd64_linux.tar.xz
          sudo install -m 0755 /tmp/upx-5.2.0-amd64_linux/upx /usr/local/bin/upx
          upx --version | head -n 1 | grep '5.2.0'

      - name: Run SmartDNS Update
        run: |
          chmod +x ./merlin-box.sh
          chmod +x ./bin/smartdns #smartdns 执行权限
          ./merlin-box.sh tool download_smartdns arm64

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            echo "检测到 SmartDNS 文件已更新，开始提交..."
            git add .
            git commit -m "update smartdns"
            git push
          else
            echo "SmartDNS 文件无变化，无需提交。"
          fi
